# Connexion à la base de données (facultatif : sans ce fichier, les valeurs par défaut de WampServer sont utilisées).
# Ce fichier doit être placé dans le dossier d'où l'application est lancée (la racine du projet).
# Les variables d'environnement BUDGET_DB_URL, BUDGET_DB_USER et BUDGET_DB_PASSWORD ont la priorité.
#
# IMPORTANT : 127.0.0.1 est préférable à "localhost" pour éviter la latence DNS Windows (1-3 secondes).
# Si XAMPP utilise le port 3307, changez le port ici sans toucher au code.

db.url=jdbc:mysql://127.0.0.1:3306/gestionnaire_budget?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
db.user=root
db.password=
